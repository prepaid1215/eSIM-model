<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>eSIM 단말모델명 생성기</title>
<style>
:root{
  --bg:#edf4fb;
  --card:#ffffff;
  --text:#243447;
  --muted:#6b7f93;
  --line:#d7e4f0;
  --accent:#4f8fcf;
  --accent2:#356da8;
  --soft:#f5f9fd;
  --shadow:0 10px 24px rgba(79,143,207,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;
}
body{padding-bottom:40px}
button,input{font:inherit}
button{touch-action:manipulation;cursor:pointer}

.wrap{
  max-width:520px;
  margin:0 auto;
  padding:0 14px;
}

.header{
  background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 16px) 0 8px;
}

h1{
  margin:0;
  font-size:23px;
  font-weight:900;
  line-height:1.25;
}

.sub{
  margin:7px 0 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.reset{
  margin-top:10px;
  height:38px;
  padding:0 14px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#fff;
  color:var(--text);
  font-weight:800;
}

.card{
  margin-top:14px;
  padding:16px;
  background:var(--card);
  border:1px solid #e2edf7;
  border-radius:18px;
  box-shadow:var(--shadow);
}

.step{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.num{
  width:29px;
  height:29px;
  border-radius:50%;
  background:var(--accent);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:900;
  flex:0 0 29px;
}

.step strong{font-size:16px}

.step small{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
  line-height:1.4;
}

.brand-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.brand-btn{
  min-height:68px;
  border:1px solid var(--line);
  border-radius:16px;
  background:#fff;
  font-size:17px;
  font-weight:900;
  color:var(--text);
}

.brand-btn.active{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
  box-shadow:0 8px 18px rgba(79,143,207,.18);
}

.category-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.cat-btn{
  min-height:48px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  color:#40566d;
  font-weight:900;
  font-size:14px;
}

.cat-btn.active{
  background:#eaf3fc;
  border-color:#8bb8df;
  color:#315e88;
}

.model-list{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}

.model-btn{
  min-height:58px;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:15px;
  background:#fff;
  color:var(--text);
  font-weight:900;
  text-align:left;
}

.model-btn.active{
  background:#edf6fe;
  border:2px solid var(--accent);
  padding:11px 13px;
}

.model-sub{
  display:block;
  font-size:12px;
  font-weight:700;
  color:var(--muted);
  margin-top:3px;
}

.condition-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.condition-btn{
  min-height:54px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  color:var(--text);
  font-weight:900;
}

.condition-btn.active{
  background:#eaf3fc;
  border-color:#8bb8df;
  color:#315e88;
  box-shadow:0 6px 14px rgba(79,143,207,.12);
}

.condition-note{
  margin-top:10px;
  padding:12px;
  border-radius:13px;
  background:#f4f9fe;
  border:1px solid #dbe8f4;
  color:#60758a;
  font-size:12px;
  line-height:1.55;
}

.storage-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.storage-btn{
  min-height:56px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  color:var(--text);
  font-weight:900;
}

.storage-btn.active{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}

.selected{
  margin-top:12px;
  min-height:56px;
  padding:13px 14px;
  border:1px solid #dfeaf5;
  border-radius:14px;
  background:#f7fbff;
  display:flex;
  align-items:center;
  font-size:14px;
  line-height:1.5;
}

.more-btn{
  width:100%;
  min-height:48px;
  margin-top:12px;
  border:1px dashed #a9c7e0;
  border-radius:14px;
  background:#f7fbff;
  color:#4b6f91;
  font-weight:900;
}

.manual{
  margin-top:12px;
  padding:14px;
  border:1px solid #dbe8f4;
  border-radius:14px;
  background:#f4f9fe;
}

.manual p{
  margin:0 0 10px;
  color:#60758a;
  font-size:13px;
  line-height:1.55;
}

.input{
  width:100%;
  height:52px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  padding:0 14px;
  font-size:16px;
  outline:none;
}

.result-card{
  margin-top:14px;
  padding:16px;
  background:#f9fcff;
  border:1px solid #cfe0ee;
  border-radius:18px;
  box-shadow:var(--shadow);
}

.result-label{
  font-size:12px;
  color:var(--muted);
  font-weight:800;
}

.result{
  min-height:30px;
  margin-top:6px;
  font-size:20px;
  font-weight:900;
  word-break:break-all;
}

.copy{
  width:100%;
  height:56px;
  margin-top:12px;
  border:0;
  border-radius:16px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  font-size:17px;
  font-weight:900;
}

.copy:disabled{opacity:.35}

.status{
  margin-top:7px;
  text-align:right;
  font-size:12px;
  color:var(--muted);
}

.hidden{display:none!important}

@media (max-width:420px){
  .category-grid{
    grid-template-columns:repeat(3,1fr);
  }
}
</style>

<header class="header">
  <div class="wrap">
    <h1>eSIM 단말모델명 생성기</h1>
    <p class="sub">
      아이폰/갤럭시 → 시리즈 → 기종 → 용량 순서로 선택하세요.
    </p>
    <button type="button" class="reset" id="resetBtn">
      처음부터
    </button>
  </div>
</header>

<main class="wrap">

  <div class="card">
    <div class="step">
      <div class="num">1</div>
      <div>
        <strong>휴대폰 종류</strong>
        <small>아이폰 또는 갤럭시를 선택하세요.</small>
      </div>
    </div>

    <div class="brand-grid">
      <button type="button" class="brand-btn" data-brand="iphone">
        아이폰
      </button>

      <button type="button" class="brand-btn" data-brand="galaxy">
        갤럭시
      </button>
    </div>
  </div>

  <div class="card hidden" id="seriesCard">
    <div class="step">
      <div class="num">2</div>
      <div>
        <strong>시리즈 선택</strong>
        <small id="seriesHelp">
          사용 중인 시리즈를 선택하세요.
        </small>
      </div>
    </div>

    <div id="seriesGrid" class="category-grid"></div>
  </div>

  <div class="card hidden" id="modelCard">
    <div class="step">
      <div class="num">3</div>
      <div>
        <strong>정확한 기종 선택</strong>
        <small>내 휴대폰과 같은 기종을 누르세요.</small>
      </div>
    </div>

    <div id="modelList" class="model-list"></div>

    <button type="button" class="more-btn" id="manualToggle">
      내 기종이 없어요
    </button>

    <div class="manual hidden" id="manualBox">
      <p id="manualGuide"></p>
      <input
        id="manualModel"
        class="input"
        placeholder="모델번호 입력"
      >
    </div>
  </div>

  <div class="card hidden" id="conditionCard">
    <div class="step">
      <div class="num">4</div>
      <div>
        <strong>아이폰 상태 선택</strong>
        <small>아이폰 15 이하에서만 선택합니다.</small>
      </div>
    </div>

    <div class="condition-grid">

      <button
        type="button"
        class="condition-btn"
        data-condition="ULK"
      >
        자급제
      </button>

      <button
        type="button"
        class="condition-btn"
        data-condition="R"
      >
        리퍼
      </button>

      <button
        type="button"
        class="condition-btn"
        data-condition="UD"
      >
        중고
      </button>

      <button
        type="button"
        class="condition-btn"
        data-condition="TAC"
      >
        외산
      </button>

    </div>

    <div class="condition-note">
      자급제 ULK · 애플 정식 리퍼 R · 개인거래/중고매입 UD · 해외판 TAC
    </div>
  </div>

  <div class="card hidden" id="storageCard">
    <div class="step">
      <div class="num" id="storageStepNum">4</div>
      <div>
        <strong>저장용량 선택</strong>
        <small>사용 중인 휴대폰의 용량을 누르세요.</small>
      </div>
    </div>

    <div id="storageGrid" class="storage-grid"></div>

    <div id="selectedInfo" class="selected">
      기종을 먼저 선택하세요.
    </div>
  </div>

  <div class="result-card">
    <div class="result-label">
      앤텔레콤 입력용 모델명
    </div>

    <div id="result" class="result">
      기종과 용량을 선택하세요.
    </div>

    <button
      type="button"
      id="copyBtn"
      class="copy"
      disabled
    >
      모델명 복사
    </button>

    <div id="status" class="status"></div>
  </div>

</main>

const manualStorages=[
  "64",
  "128",
  "256",
  "512",
  "1TB",
  "2TB"
];


let brand="";
let series="";
let selectedModel=null;
let selectedStorage="";
let manualMode=false;
let iphoneCondition="";


function isIphone15OrBelow(){

  if(brand!=="iphone") return false;

  if(manualMode) return true;

  if(!series) return false;

  return ![
    "16",
    "17"
  ].includes(series);

}


function prefixForIphone(){

  if(!isIphone15OrBelow()){
    return "ULK";
  }

  return iphoneCondition || "";

}


function updateConditionVisibility(){

  const needsCondition=
    isIphone15OrBelow();

  $("conditionCard")
    .classList
    .toggle(
      "hidden",
      !needsCondition
    );

  $("storageStepNum")
    .textContent=
      needsCondition
        ? "5"
        : "4";

  if(!needsCondition){

    iphoneCondition="";

    document
      .querySelectorAll(".condition-btn")
      .forEach(
        b=>b.classList.remove("active")
      );

  }

}


function storageLabel(s){

  return s.includes("TB")
    ? s
    : s+"GB";

}


function resetFromSeries(){

  series="";
  selectedModel=null;
  selectedStorage="";
  manualMode=false;
  iphoneCondition="";

  $("conditionCard")
    .classList
    .add("hidden");

  document
    .querySelectorAll(".condition-btn")
    .forEach(
      b=>b.classList.remove("active")
    );

  $("manualBox")
    .classList
    .add("hidden");

  $("manualModel")
    .value="";

  $("modelCard")
    .classList
    .add("hidden");

  $("storageCard")
    .classList
    .add("hidden");

  updateResult();

}


function chooseBrand(next){

  brand=next;

  resetFromSeries();

  document
    .querySelectorAll(".brand-btn")
    .forEach(btn=>{

      btn.classList.toggle(
        "active",
        btn.dataset.brand===next
      );

    });

  $("conditionCard")
    .classList
    .add("hidden");

  $("seriesCard")
    .classList
    .remove("hidden");

  $("seriesHelp")
    .textContent=
      next==="iphone"
        ? "사용 중인 아이폰 세대를 선택하세요."
        : "사용 중인 갤럭시 시리즈를 선택하세요.";

  renderSeries();

}


function renderSeries(){

  const box=
    $("seriesGrid");

  box.innerHTML="";

  data[brand]
    .series
    .forEach(s=>{

      const b=
        document.createElement("button");

      b.type="button";

      b.className=
        "cat-btn"+
        (
          series===s
            ? " active"
            : ""
        );

      b.textContent=s;

      b.addEventListener(
        "click",
        ()=>{

          series=s;

          selectedModel=null;
          selectedStorage="";
          manualMode=false;
          iphoneCondition="";

          $("conditionCard")
            .classList
            .add("hidden");

          document
            .querySelectorAll(".condition-btn")
            .forEach(
              b=>b.classList.remove("active")
            );

          $("manualBox")
            .classList
            .add("hidden");

          $("manualModel")
            .value="";

          renderSeries();

          renderModels();

          $("modelCard")
            .classList
            .remove("hidden");

          $("storageCard")
            .classList
            .add("hidden");

          updateResult();

          $("modelCard")
            .scrollIntoView({
              behavior:"smooth",
              block:"start"
            });

        }
      );

      box.appendChild(b);

    });

}


function renderModels(){

  const box=
    $("modelList");

  box.innerHTML="";

  const list=
    data[brand]
      .models[series] || [];

  list.forEach(m=>{

    const b=
      document.createElement("button");

    b.type="button";

    b.className=
      "model-btn"+
      (
        selectedModel?.code===m.code
          ? " active"
          : ""
      );

    b.innerHTML=
      `${m.name}
      <span class="model-sub">
        ${m.code.replace("ULK-","")}
      </span>`;

    b.addEventListener(
      "click",
      ()=>{

        selectedModel=m;
        selectedStorage="";
        manualMode=false;
        iphoneCondition="";

        document
          .querySelectorAll(".condition-btn")
          .forEach(
            b=>b.classList.remove("active")
          );

        $("manualBox")
          .classList
          .add("hidden");

        $("manualModel")
          .value="";

        renderModels();

        updateConditionVisibility();

        renderStorage();

        updateResult();

        if(isIphone15OrBelow()){

          $("storageCard")
            .classList
            .add("hidden");

          $("conditionCard")
            .classList
            .remove("hidden");

          $("conditionCard")
            .scrollIntoView({
              behavior:"smooth",
              block:"start"
            });

        }

        else{

          $("conditionCard")
            .classList
            .add("hidden");

          $("storageCard")
            .classList
            .remove("hidden");

          $("storageCard")
            .scrollIntoView({
              behavior:"smooth",
              block:"start"
            });

        }

      }
    );

    box.appendChild(b);

  });

}


function renderStorage(){

  const box=
    $("storageGrid");

  box.innerHTML="";

  const list=
    manualMode
      ? manualStorages
      : (
          selectedModel?.storages || []
        );

  list.forEach(s=>{

    const b=
      document.createElement("button");

    b.type="button";

    b.className=
      "storage-btn"+
      (
        selectedStorage===s
          ? " active"
          : ""
      );

    b.textContent=
      storageLabel(s);

    b.addEventListener(
      "click",
      ()=>{

        selectedStorage=s;

        renderStorage();

        updateResult();

      }
    );

    box.appendChild(b);

  });

}


function updateResult(){

  let value="";
  let info="";

  if(manualMode){

    const m=
      $("manualModel")
        .value
        .trim()
        .toUpperCase()
        .replace(/\s/g,"");

    if(m){

      info=
        `<b>${m}</b>${
          selectedStorage
            ? " · "+storageLabel(selectedStorage)
            : ""
        }`;

      if(selectedStorage){

        if(brand==="iphone"){

          const prefix=
            prefixForIphone();

          if(prefix){

            value=
              `${prefix}-${m}-${selectedStorage}`;

          }

        }

        else{

          value=
            `OMD-${m}${selectedStorage}`;

        }

      }

    }

    else{

      info=
        "모델번호를 입력하세요.";

    }

  }

  else if(selectedModel){

    info=
      `<b>${selectedModel.name}</b>${
        selectedStorage
          ? " · "+storageLabel(selectedStorage)
          : ""
      }`;

    if(selectedStorage){

      if(brand==="iphone"){

        if(isIphone15OrBelow()){

          const prefix=
            prefixForIphone();

          const aModel=
            selectedModel.code
              .replace(
                /^ULK-/,
                ""
              );

          if(prefix){

            value=
              `${prefix}-${aModel}-${selectedStorage}`;

          }

        }

        else{

          const storageCode=
            selectedStorage==="1TB"
              ? "1T"
              : selectedStorage==="2TB"
              ? "2T"
              : selectedStorage;

          value=
            `${selectedModel.code}-${storageCode}`;

        }

      }

      else{

        value=
          `OMD-${selectedModel.code}${selectedStorage}`;

      }

    }

  }

  else{

    info=
      "기종을 먼저 선택하세요.";

  }

  $("selectedInfo")
    .innerHTML=
      info;

  let emptyText=
    "기종과 용량을 선택하세요.";

  if(
    isIphone15OrBelow() &&
    (
      selectedModel ||
      manualMode
    ) &&
    !iphoneCondition
  ){

    emptyText=
      "자급제·리퍼·중고·외산 중 하나를 선택하세요.";

  }

  $("result")
    .textContent=
      value || emptyText;

  $("copyBtn")
    .disabled=
      !value;

  $("copyBtn")
    .dataset.value=
      value || "";

}


document
  .querySelectorAll(".condition-btn")
  .forEach(btn=>{

    btn.addEventListener(
      "click",
      ()=>{

        iphoneCondition=
          btn.dataset.condition;

        document
          .querySelectorAll(".condition-btn")
          .forEach(b=>{

            b.classList.toggle(
              "active",
              b===btn
            );

          });

        selectedStorage="";

        renderStorage();

        updateResult();

        $("storageCard")
          .classList
          .remove("hidden");

        $("storageCard")
          .scrollIntoView({
            behavior:"smooth",
            block:"start"
          });

      }
    );

  });


$("manualToggle")
  .addEventListener(
    "click",
    ()=>{

      manualMode=
        !manualMode;

      selectedModel=null;
      selectedStorage="";

      $("manualBox")
        .classList
        .toggle(
          "hidden",
          !manualMode
        );

      $("manualGuide")
        .innerHTML=
          brand==="iphone"
            ? "<b>설정 → 일반 → 정보 → 모델 번호</b>에서 A로 시작하는 번호를 입력하세요."
            : "<b>설정 → 휴대전화 정보</b>에서 SM-으로 시작하는 모델번호를 입력하세요.";

      $("manualModel")
        .placeholder=
          brand==="iphone"
            ? "예: A2894"
            : "예: SM-S936N";

      renderModels();

      updateConditionVisibility();

      renderStorage();

      updateResult();

      if(brand==="iphone"){

        $("conditionCard")
          .classList
          .remove("hidden");

        $("storageCard")
          .classList
          .add("hidden");

        $("conditionCard")
          .scrollIntoView({
            behavior:"smooth",
            block:"start"
          });

      }

      else{

        $("conditionCard")
          .classList
          .add("hidden");

        $("storageCard")
          .classList
          .remove("hidden");

      }

    }
  );


$("manualModel")
  .addEventListener(
    "input",
    updateResult
  );


document
  .querySelectorAll(".brand-btn")
  .forEach(btn=>{

    btn.addEventListener(
      "click",
      ()=>chooseBrand(
        btn.dataset.brand
      )
    );

  });


$("resetBtn")
  .addEventListener(
    "click",
    ()=>{

      brand="";
      series="";
      selectedModel=null;
      selectedStorage="";
      manualMode=false;
      iphoneCondition="";

      document
        .querySelectorAll(".condition-btn")
        .forEach(
          btn=>btn.classList.remove("active")
        );

      document
        .querySelectorAll(".brand-btn")
        .forEach(
          btn=>btn.classList.remove("active")
        );

      $("seriesCard")
        .classList
        .add("hidden");

      $("modelCard")
        .classList
        .add("hidden");

      $("storageCard")
        .classList
        .add("hidden");

      $("conditionCard")
        .classList
        .add("hidden");

      $("manualBox")
        .classList
        .add("hidden");

      $("manualModel")
        .value="";

      $("status")
        .textContent="";

      updateResult();

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    }
  );


$("copyBtn")
  .addEventListener(
    "click",
    async()=>{

      const value=
        $("copyBtn")
          .dataset.value;

      if(!value) return;

      try{

        await navigator
          .clipboard
          .writeText(value);

      }

      catch(e){

        const t=
          document.createElement("textarea");

        t.value=value;

        document.body
          .appendChild(t);

        t.select();

        document
          .execCommand("copy");

        t.remove();

      }

      $("copyBtn")
        .textContent=
          "복사 완료";

      $("status")
        .textContent=
          "클립보드에 복사했습니다.";

      setTimeout(
        ()=>{

          $("copyBtn")
            .textContent=
              "모델명 복사";

          $("status")
            .textContent="";

        },
        1200
      );

    }
  );


updateResult();

</script>

</body>
</html>
