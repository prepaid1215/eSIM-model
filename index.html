<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>eSIM 단말모델명 생성기</title>

<style>
:root{
  --bg:#edf4fb;
  --card:#fff;
  --text:#243447;
  --muted:#6b7f93;
  --line:#d7e4f0;
  --accent:#4f8fcf;
  --accent2:#356da8;
  --soft:#f5f9fd;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;
}

body{
  padding-bottom:40px;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
  touch-action:manipulation;
}

.wrap{
  max-width:520px;
  margin:0 auto;
  padding:0 14px;
}

.header{
  padding:calc(env(safe-area-inset-top) + 16px) 0 8px;
}

h1{
  margin:0;
  font-size:23px;
  font-weight:900;
}

.sub{
  margin:7px 0 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.reset{
  margin-top:10px;
  height:38px;
  padding:0 14px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#fff;
  font-weight:800;
}

.card{
  margin-top:14px;
  padding:16px;
  background:var(--card);
  border:1px solid #e2edf7;
  border-radius:18px;
}

.step{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.num{
  width:29px;
  height:29px;
  border-radius:50%;
  background:var(--accent);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:900;
  flex:0 0 29px;
}

.step strong{
  font-size:16px;
}

.step small{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
  line-height:1.4;
}

.brand-grid,
.purchase-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.brand-btn{
  min-height:68px;
  border:1px solid var(--line);
  border-radius:16px;
  background:#fff;
  font-size:17px;
  font-weight:900;
  color:var(--text);
}

.brand-btn.active,
.choice.active,
.storage-btn.active{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}

.category-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.cat-btn,
.choice,
.storage-btn{
  min-height:50px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  color:var(--text);
  font-weight:900;
}

.cat-btn.active{
  background:#eaf3fc;
  border-color:#8bb8df;
  color:#315e88;
}

.model-list{
  display:grid;
  gap:10px;
}

.model-btn{
  min-height:58px;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:15px;
  background:#fff;
  color:var(--text);
  font-weight:900;
  text-align:left;
}

.model-btn.active{
  background:#edf6fe;
  border:2px solid var(--accent);
  padding:11px 13px;
}

.storage-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.note{
  margin-top:10px;
  padding:12px;
  border:1px solid #dbe8f4;
  border-radius:13px;
  background:#f4f9fe;
  color:#60758a;
  font-size:12px;
  line-height:1.55;
}

.manual{
  margin-top:12px;
  padding:14px;
  border:1px solid #dbe8f4;
  border-radius:14px;
  background:#f4f9fe;
}

.manual p{
  margin:0 0 10px;
  color:#60758a;
  font-size:13px;
  line-height:1.55;
}

.input{
  width:100%;
  height:52px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  padding:0 14px;
  font-size:16px;
}

.selected{
  margin-top:12px;
  padding:13px 14px;
  border:1px solid #dfeaf5;
  border-radius:14px;
  background:#f7fbff;
  font-size:14px;
  line-height:1.5;
}

.result-card{
  margin-top:14px;
  padding:16px;
  background:#f9fcff;
  border:1px solid #cfe0ee;
  border-radius:18px;
}

.result-label{
  font-size:12px;
  color:var(--muted);
  font-weight:800;
}

.result{
  min-height:30px;
  margin-top:6px;
  font-size:20px;
  font-weight:900;
  word-break:break-all;
}

.copy{
  width:100%;
  height:56px;
  margin-top:12px;
  border:0;
  border-radius:16px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  font-size:17px;
  font-weight:900;
}

.copy:disabled{
  opacity:.35;
}

.status{
  margin-top:7px;
  text-align:right;
  font-size:12px;
  color:var(--muted);
}

.hidden{
  display:none!important;
}

@media(max-width:420px){
  .category-grid{
    grid-template-columns:repeat(3,1fr);
  }
}
</style>

<body>

<header class="header">
  <div class="wrap">
    <h1>eSIM 단말모델명 생성기</h1>

    <p class="sub">
      전문용어를 몰라도 구입한 방법만 선택하면 됩니다.
    </p>

    <button class="reset" id="resetBtn">
      처음부터
    </button>
  </div>
</header>

<main class="wrap">

<div class="card">

  <div class="step">
    <div class="num">1</div>

    <div>
      <strong>휴대폰 종류</strong>
      <small>아이폰 또는 갤럭시를 선택하세요.</small>
    </div>
  </div>

  <div class="brand-grid">

    <button class="brand-btn" data-brand="iphone">
      아이폰
    </button>

    <button class="brand-btn" data-brand="galaxy">
      갤럭시
    </button>

  </div>

</div>


<div class="card hidden" id="seriesCard">

  <div class="step">
    <div class="num">2</div>

    <div>
      <strong>시리즈 선택</strong>
      <small>사용 중인 시리즈를 선택하세요.</small>
    </div>
  </div>

  <div
    class="category-grid"
    id="seriesGrid">
  </div>

</div>


<div class="card hidden" id="modelCard">

  <div class="step">
    <div class="num">3</div>

    <div>
      <strong>기종 선택</strong>
      <small>내 휴대폰과 같은 기종을 누르세요.</small>
    </div>
  </div>

  <div
    class="model-list"
    id="modelList">
  </div>

</div>


<div class="card hidden" id="purchaseCard">

  <div class="step">

    <div class="num">4</div>

    <div>
      <strong>이 휴대폰은 어떻게 구입하셨나요?</strong>
      <small>자급제 같은 용어를 몰라도 됩니다.</small>
    </div>

  </div>

  <div class="purchase-grid">

    <button
      class="choice"
      data-purchase="new">
      애플스토어·쿠팡 등에서 새제품 구매
    </button>

    <button
      class="choice"
      data-purchase="carrier">
      SKT·KT·LG U+에서 새폰 구매
    </button>

    <button
      class="choice"
      data-purchase="used">
      중고로 구매
    </button>

    <button
      class="choice"
      data-purchase="refurb">
      애플 리퍼 제품
    </button>

    <button
      class="choice"
      data-purchase="overseas">
      해외에서 구매
    </button>

    <button
      class="choice"
      data-purchase="unknown">
      잘 모르겠어요
    </button>

  </div>

  <div
    class="manual hidden"
    id="manualBox">

    <p id="manualGuide"></p>

    <input
      class="input"
      id="manualModel"
      placeholder="예: A3106">

  </div>

  <div
    class="note hidden"
    id="purchaseNote">
  </div>

</div>


<div class="card hidden" id="storageCard">

  <div class="step">

    <div
      class="num"
      id="storageStep">
      4
    </div>

    <div>
      <strong>저장용량 선택</strong>
      <small>휴대폰 용량을 선택하세요.</small>
    </div>

  </div>

  <div
    class="storage-grid"
    id="storageGrid">
  </div>

  <div
    class="selected"
    id="selectedInfo">
  </div>

</div>


<div class="result-card">

  <div class="result-label">
    앤텔레콤 입력용 모델명
  </div>

  <div
    class="result"
    id="result">
    기종과 용량을 선택하세요.
  </div>

  <button
    class="copy"
    id="copyBtn"
    disabled>
    모델명 복사
  </button>

  <div
    class="status"
    id="status">
  </div>

</div>

</main>

let brand="";
let series="";
let model=null;
let storage="";
let purchase="";
let manualA="";


function isOldIphone(){

  return (
    brand==="iphone" &&
    !["16","17"].includes(series)
  );

}


function labelStorage(s){

  return s.includes("TB")
    ? s
    : s+"GB";

}


function storageCode(s){

  return s==="1TB"
    ? "1T"
    : s==="2TB"
    ? "2T"
    : s;

}


function show(id,on=true){

  $(id)
    .classList
    .toggle(
      "hidden",
      !on
    );

}


function scrollToCard(id){

  setTimeout(
    ()=>{

      $(id)
        .scrollIntoView({
          behavior:"smooth",
          block:"start"
        });

    },
    80
  );

}


function clearAfterBrand(){

  series="";
  model=null;
  storage="";
  purchase="";
  manualA="";

  show(
    "seriesCard"
  );

  show(
    "modelCard",
    false
  );

  show(
    "purchaseCard",
    false
  );

  show(
    "storageCard",
    false
  );

  $("manualModel")
    .value="";

  updateResult();

}


function renderSeries(){

  const box=
    $("seriesGrid");

  box.innerHTML="";

  data[brand]
    .series
    .forEach(s=>{

      const b=
        document.createElement(
          "button"
        );

      b.className=
        "cat-btn"+
        (
          series===s
            ? " active"
            : ""
        );

      b.textContent=s;

      b.onclick=()=>{

        series=s;
        model=null;
        storage="";
        purchase="";
        manualA="";

        renderSeries();

        renderModels();

        show(
          "modelCard"
        );

        show(
          "purchaseCard",
          false
        );

        show(
          "storageCard",
          false
        );

        updateResult();

        scrollToCard(
          "modelCard"
        );

      };

      box.appendChild(b);

    });

}


function renderModels(){

  const box=
    $("modelList");

  box.innerHTML="";

  (
    data[brand]
      .models[series] || []
  )
  .forEach(m=>{

    const b=
      document.createElement(
        "button"
      );

    b.className=
      "model-btn"+
      (
        model===m
          ? " active"
          : ""
      );

    b.textContent=
      m[0];

    b.onclick=()=>{

      model=m;
      storage="";
      purchase="";
      manualA="";

      renderModels();

      if(
        isOldIphone()
      ){

        show(
          "purchaseCard"
        );

        show(
          "storageCard",
          false
        );

        $("storageStep")
          .textContent="5";

        resetPurchaseButtons();

        show(
          "manualBox",
          false
        );

        show(
          "purchaseNote",
          false
        );

        scrollToCard(
          "purchaseCard"
        );

      }

      else{

        show(
          "purchaseCard",
          false
        );

        show(
          "storageCard"
        );

        $("storageStep")
          .textContent="4";

        renderStorage();

        scrollToCard(
          "storageCard"
        );

      }

      updateResult();

    };

    box.appendChild(b);

  });

}


function resetPurchaseButtons(){

  document
    .querySelectorAll(
      ".choice"
    )
    .forEach(
      x=>
        x.classList.remove(
          "active"
        )
    );

}


function choosePurchase(
  p,
  btn
){

  purchase=p;
  storage="";
  manualA="";

  $("manualModel")
    .value="";

  resetPurchaseButtons();

  btn.classList
    .add("active");

  show(
    "manualBox",
    false
  );

  show(
    "purchaseNote",
    false
  );


  if(
    p==="new"
  ){

    show(
      "storageCard"
    );

    renderStorage();

    scrollToCard(
      "storageCard"
    );

  }


  else if(
    [
      "used",
      "refurb",
      "overseas"
    ]
    .includes(p)
  ){

    show(
      "manualBox"
    );

    $("manualGuide")
      .innerHTML=
        "<b>설정 → 일반 → 정보 → 모델 번호</b>를 한 번 눌러 A로 시작하는 번호를 입력하세요.<br><br>중고·리퍼·해외폰은 실제 단말의 A번호를 확인하는 것이 가장 안전합니다.";

    show(
      "storageCard"
    );

    renderStorage();

    scrollToCard(
      "manualBox"
    );

  }


  else if(
    p==="carrier"
  ){

    show(
      "purchaseNote"
    );

    $("purchaseNote")
      .innerHTML=
        "<b>SKT·KT·LG U+에서 구입한 폰</b><br><br>약정이 끝났더라도 구매 경로가 자급제로 바뀌는 것은 아닙니다.<br><br>현재는 통신사 출고폰의 모델명 코드를 임의로 생성하지 않습니다. 실제 모델번호를 확인한 뒤 상담 확인이 필요합니다.";

    show(
      "storageCard",
      false
    );

  }


  else{

    show(
      "manualBox"
    );

    $("manualGuide")
      .innerHTML=
        "<b>잘 모르겠다면 모델번호부터 확인하세요.</b><br><br>설정 → 일반 → 정보 → 모델 번호를 한 번 눌러 A로 시작하는 번호를 확인해 주세요.<br><br>구입 경로가 확인되지 않으면 최종 모델명은 상담 확인이 필요합니다.";

    show(
      "storageCard",
      false
    );

    scrollToCard(
      "manualBox"
    );

  }

  updateResult();

}


function renderStorage(){

  const box=
    $("storageGrid");

  box.innerHTML="";

  if(
    !model
  ){
    return;
  }

  model[2]
    .forEach(s=>{

      const b=
        document.createElement(
          "button"
        );

      b.className=
        "storage-btn"+
        (
          storage===s
            ? " active"
            : ""
        );

      b.textContent=
        labelStorage(s);

      b.onclick=()=>{

        storage=s;

        renderStorage();

        updateResult();

      };

      box.appendChild(b);

    });

}


function currentA(){

  const typed=
    $("manualModel")
      .value
      .trim()
      .toUpperCase()
      .replace(
        /\s/g,
        ""
      );

  return (
    typed ||
    model?.[1] ||
    ""
  );

}


function updateResult(){

  let value="";
  let msg=
    "기종과 용량을 선택하세요.";

  let info="";


  if(
    model
  ){

    info=
      "<b>"+
      model[0]+
      "</b>";

    if(
      storage
    ){

      info+=
        " · "+
        labelStorage(storage);

    }

  }


  if(
    brand==="galaxy" &&
    model &&
    storage
  ){

    value=
      `OMD-${model[1]}${
        storage==="1TB"
          ? "1TB"
          : storage==="2TB"
          ? "2TB"
          : storage
      }`;

  }


  else if(
    brand==="iphone" &&
    model &&
    !isOldIphone() &&
    storage
  ){

    value=
      `${model[1]}-${storageCode(storage)}`;

  }


  else if(
    isOldIphone() &&
    model
  ){

    if(
      !purchase
    ){

      msg=
        "휴대폰을 어떻게 구입했는지 선택하세요.";

    }


    else if(
      purchase==="carrier"
    ){

      msg=
        "통신사 구입폰은 모델번호 확인 후 상담이 필요합니다.";

    }


    else if(
      purchase==="unknown"
    ){

      msg=
        "구입 경로 확인 후 최종 코드를 생성할 수 있습니다.";

    }


    else{

      const prefix={

        new:"ULK",
        used:"UD",
        refurb:"R",
        overseas:"TAC"

      }[purchase];


      const a=
        currentA();


      if(
        !a
      ){

        msg=
          "A로 시작하는 모델번호를 입력하세요.";

      }


      else if(
        !storage
      ){

        msg=
          "저장용량을 선택하세요.";

      }


      else{

        value=
          `${prefix}-${a}-${storageCode(storage)}`;

      }

    }

  }


  $("selectedInfo")
    .innerHTML=
      info ||
      "기종을 먼저 선택하세요.";


  $("result")
    .textContent=
      value ||
      msg;


  $("copyBtn")
    .disabled=
      !value;


  $("copyBtn")
    .dataset.value=
      value;

}


document
  .querySelectorAll(
    ".brand-btn"
  )
  .forEach(b=>{

    b.onclick=()=>{

      brand=
        b.dataset.brand;

      document
        .querySelectorAll(
          ".brand-btn"
        )
        .forEach(x=>{

          x.classList.toggle(
            "active",
            x===b
          );

        });

      clearAfterBrand();

      renderSeries();

      scrollToCard(
        "seriesCard"
      );

    };

  });


document
  .querySelectorAll(
    ".choice"
  )
  .forEach(b=>{

    b.onclick=()=>{

      choosePurchase(
        b.dataset.purchase,
        b
      );

    };

  });


$("manualModel")
  .addEventListener(
    "input",
    ()=>{

      manualA=
        $("manualModel")
          .value;

      updateResult();

    }
  );


$("copyBtn")
  .onclick=
    async()=>{

      const v=
        $("copyBtn")
          .dataset.value;

      if(
        !v
      ){
        return;
      }


      try{

        await navigator
          .clipboard
          .writeText(v);

      }


      catch(e){

        const t=
          document.createElement(
            "textarea"
          );

        t.value=v;

        document
          .body
          .appendChild(t);

        t.select();

        document
          .execCommand(
            "copy"
          );

        t.remove();

      }


      $("copyBtn")
        .textContent=
          "복사 완료";


      $("status")
        .textContent=
          "클립보드에 복사했습니다.";


      setTimeout(
        ()=>{

          $("copyBtn")
            .textContent=
              "모델명 복사";

          $("status")
            .textContent="";

        },
        1200
      );

    };


$("resetBtn")
  .onclick=()=>{

    brand="";
    series="";
    model=null;
    storage="";
    purchase="";
    manualA="";


    document
      .querySelectorAll(
        ".brand-btn,.choice"
      )
      .forEach(
        x=>
          x.classList.remove(
            "active"
          )
      );


    [
      "seriesCard",
      "modelCard",
      "purchaseCard",
      "storageCard",
      "manualBox",
      "purchaseNote"
    ]
    .forEach(
      id=>
        show(
          id,
          false
        )
    );


    $("manualModel")
      .value="";


    updateResult();


    window
      .scrollTo({
        top:0,
        behavior:"smooth"
      });

  };


updateResult();

</script>

</body>
</html>
